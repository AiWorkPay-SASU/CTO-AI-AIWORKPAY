name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The project has no runtime dependency; there is nothing to install.
      - name: Lint (syntax + repository rules)
        run: npm run lint
      - name: Secret scan
        run: npm run scan
      - name: Tests
        run: npm test
