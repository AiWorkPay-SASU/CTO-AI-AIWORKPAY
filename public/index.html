<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MissionControl — CTO IA</title>
  <link rel="stylesheet" href="/ui.css">
</head>
<body>
  <header>
    <h1>MissionControl <small>CTO IA</small></h1>
    <form id="login" autocomplete="off">
      <label for="token">Jeton</label>
      <input id="token" type="password" autocomplete="off" required minlength="24" placeholder="CTO_ADMIN_TOKEN">
      <button type="submit">Connexion</button>
    </form>
    <span id="who" hidden></span>
  </header>

  <div id="banner" role="alert" hidden></div>

  <main>
    <section id="agents-panel" aria-labelledby="agents-title">
      <h2 id="agents-title">Agents</h2>
      <ul id="agents"></ul>
    </section>

    <section id="new-panel" aria-labelledby="new-title">
      <h2 id="new-title">Nouvelle mission</h2>
      <form id="new-mission">
        <input id="project" placeholder="owner/repo" required pattern="[A-Za-z0-9][A-Za-z0-9\-]*/[A-Za-z0-9_.\-]+">
        <textarea id="objective" placeholder="Objectif" required maxlength="2000" rows="3"></textarea>
        <input id="budget" type="number" min="0.1" max="50" step="0.1" value="2" aria-label="Budget en USD">
        <button type="submit">Créer</button>
      </form>
    </section>

    <section id="missions-panel" aria-labelledby="missions-title">
      <h2 id="missions-title">Missions</h2>
      <p id="empty" hidden>Aucune mission.</p>
      <div id="missions"></div>
    </section>
  </main>
  <script src="/ui.js" defer></script>
</body>
</html>
